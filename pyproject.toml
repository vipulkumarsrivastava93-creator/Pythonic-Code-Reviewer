[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codereview"
version = "0.1.0"
description = "Local, dependency-free Pythonic + low-level-design code review agent."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[project.scripts]
codereview = "codereview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]